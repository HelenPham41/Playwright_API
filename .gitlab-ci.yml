image: mcr.microsoft.com/playwright:v1.42.1-jammy

stages:
  - test

variables:
  TEST_ENV: "stg"
  RUN_TIMES: "1"


run_fullflow_tests:
  stage: test
  tags:
    - ci-v2

  script:
    - "echo Environment: $TEST_ENV"
    - "echo Run times: $RUN_TIMES"

    # Clean old reports
    - "rm -rf playwright-report test-results reports"

    - "npm ci"

    - "echo Running Playwright tests on $ENV"

    # Run tests and capture exit code
    - |
      echo Starting Playwright tests
      npx playwright test tests/fullflow.spec.ts
      EXIT_CODE=$?

      echo Playwright exit code: $EXIT_CODE

      if [ $EXIT_CODE -ne 0 ]; then
        echo Tests failed!
        exit $EXIT_CODE
      else
        echo All tests passed!
      fi

  artifacts:
    when: always
    paths:
      - playwright-report
      - test-results
      - reports/fullflow-summary.html
      - reports/fullflow-summary.json