image: mcr.microsoft.com/playwright:v1.42.1-jammy

stages:
  - test

variables:
  ENV: "stg"

run_fullflow_tests:
  stage: test

  script:
    - echo "Running Playwright tests on $ENV"
    - npm install
    - npx playwright install
    - npx playwright test tests/fullflow.spec.ts

  artifacts:
    when: always
    paths:
      - playwright-report/

    expire_in: 7 days