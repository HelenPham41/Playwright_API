image: mcr.microsoft.com/playwright:v1.42.1-jammy

stages:
  - test

variables:
  TEST_ENV: "stg"
  RUN_TIMES: "1"
  ENV: "stg"

run_fullflow_tests:
  stage: test
  tags:
    - ci-v2

  script:
    - "echo Environment: $TEST_ENV"
    - "echo Run times: $RUN_TIMES"

    # Clean old reports
    - "rm -rf playwright-report"
    - "rm -rf test-results"
    - "rm -f fullflow-summary.html fullflow-summary.json"

    - "npm ci"
    - "echo Running Playwright tests on $ENV"
    - "npx playwright test tests/fullflow.spec.ts"

  artifacts:
    when: always
    paths:
      - playwright-report
      - test-results
      - fullflow-summary.html
      - fullflow-summary.json
    expire_in: 7 days