<html>
<head>
    <title>Full Flow Summary</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f4f4f4; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>

<body>

<h1>Full Flow Execution Summary</h1>

<p><b>Total Runs:</b> {{totalRuns}}</p>
<p class="pass"><b>Total Pass:</b> {{totalPass}}</p>
<p class="fail"><b>Total Fail:</b> {{totalFail}}</p>

<table>

<tr>
<th>Run</th>
<th>OrderId</th>
<th>SO</th>
<th>TicketId</th>
<th>Step</th>
<th>Status</th>
<th>Code</th>
<th>URL</th>
</tr>

{{rows}}

</table>

</body>
</html>
