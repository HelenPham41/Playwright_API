image: mcr.microsoft.com/playwright:v1.58.2-jammy

stages:
  - test

variables:
  TEST_ENV: "stg"
  RUN_TIMES:
    value: "1"
    description: "Number of times to repeat the full flow test (enter a number)"
  OPEN_REPORT: "false"
  PAYMENT_METHOD:
    value: "COD"
    options:
      - "COD"
      - "BankTransfer"
    description: "Payment flow to run for the full end-to-end test: COD or BankTransfer"
  COUNTRY:
    value: "VN"
    options:
      - "VN"
      - "TH"
      - "KH"
    description: "Country project to run the full end-to-end test against"

run_fullflow_tests:
  stage: test
  tags:
    - devops-runner

  script:
    - "echo Environment: $TEST_ENV"
    - "echo Run times: $RUN_TIMES"
    - "echo Payment method: $PAYMENT_METHOD"
    - "echo Country: $COUNTRY"

    # Clean old reports
    - "rm -rf playwright-report test-results reports"

    - "npm ci"

    # Pick the full-flow spec matching the requested payment method
    - |
      if [ "$PAYMENT_METHOD" = "BankTransfer" ]; then
        SPEC="tests/completeflow_bankTransfer.spec.ts"
      else
        SPEC="tests/completeflow_COD.spec.ts"
      fi
      echo Running spec: $SPEC on project: $COUNTRY

      npx playwright test "$SPEC" --project="$COUNTRY"
      EXIT_CODE=$?

      echo Playwright exit code: $EXIT_CODE

      if [ $EXIT_CODE -ne 0 ]; then
        echo Tests failed!
        exit $EXIT_CODE
      else
        echo All tests passed!
      fi

  artifacts:
    when: always
    paths:
      - playwright-report
      - test-results
      - reports/*.html
